name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure optional API secrets
        env:
          MOVIEBOX_API_KEY: ${{ secrets.MOVIEBOX_API_KEY }}
          SECONDARY_CATALOG_API_KEY: ${{ secrets.SECONDARY_CATALOG_API_KEY }}
        run: |
          if [ -n "$MOVIEBOX_API_KEY" ]; then
            echo "MOVIEBOX_API_KEY=$MOVIEBOX_API_KEY" >> .env
          fi
          if [ -n "$SECONDARY_CATALOG_API_KEY" ]; then
            echo "SECONDARY_CATALOG_API_KEY=$SECONDARY_CATALOG_API_KEY" >> .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Muvio Latest APK
          body: |
            Automatic Android APK build for **Muvio**.

            Download `app-debug.apk` from the Assets section below.
          make_latest: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
